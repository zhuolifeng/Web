server.port=8080
server.servlet.context-path=/

# ===== MySQL DataSource =====
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== SQL bootstrap =====
# Run schema.sql/data.sql every start so a freshly created (empty) database is initialised.
spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# ===== Jackson =====
spring.jackson.serialization.fail-on-empty-beans=false

# ===== JWT =====
jwt.secret=ZhuZhuBookStoreSecretKey2026ForJWTTokenGenerationAndValidation
jwt.expiration=86400000
