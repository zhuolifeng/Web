server.port=8080
server.servlet.context-path=/

# ===== MySQL DataSource =====
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== SQL bootstrap =====
# Run schema.sql/data.sql every start so a freshly created (empty) database is initialised.
spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# ===== Jackson =====
spring.jackson.serialization.fail-on-empty-beans=false

# ===== JWT =====
jwt.secret=ZhuZhuBookStoreSecretKey2026ForJWTTokenGenerationAndValidation
jwt.expiration=86400000

# ===== Kafka (hw5: 异步下单 + SSE 推送) =====
spring.kafka.bootstrap-servers=localhost:9092
bookstore.kafka.order-topic=order-events
bookstore.kafka.consumer-group=bookstore-order-consumer
# 模拟扣减库存的耗时（毫秒）
bookstore.order.process-delay-ms=3000
# SSE 连接超时（毫秒）
bookstore.order.sse-timeout-ms=300000

# ===== Redis (hw7: 图书详情 Cache-Aside 缓存) =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
# 正常数据 TTL = ttl-seconds + [0, ttl-jitter-seconds] 随机抖动（防雪崩）
bookstore.cache.book.ttl-seconds=1800
bookstore.cache.book.ttl-jitter-seconds=300
# 空对象 TTL（防穿透）
bookstore.cache.book.null-ttl-seconds=120
# 重建缓存的互斥锁（防击穿）：锁过期时间、抢锁失败后的重试间隔与次数
bookstore.cache.book.lock-ttl-seconds=10
bookstore.cache.book.lock-retry-interval-ms=50
bookstore.cache.book.lock-max-retries=60

# ===== Sentinel (hw7: 限流 / 熔断) =====
# 启动即初始化，并只对图书相关接口启用 Web 资源埋点
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.filter.url-patterns=/api/v1/book/**,/api/v1/books
# 可选：Sentinel 控制台（未启动控制台也不影响规则生效）
#spring.cloud.sentinel.transport.dashboard=localhost:8858
spring.cloud.sentinel.transport.port=8719
# GET /api/v1/book/{id} 每秒最多 5 个请求，超出返回 429
bookstore.sentinel.book-detail.qps=5
# 熔断：10s 内至少 5 个请求且异常比例 > 50% → 熔断 10s，期间返回降级信息 (503)
bookstore.sentinel.book-detail.degrade.exception-ratio=0.5
bookstore.sentinel.book-detail.degrade.min-request-amount=5
bookstore.sentinel.book-detail.degrade.stat-interval-ms=10000
bookstore.sentinel.book-detail.degrade.time-window-seconds=10
