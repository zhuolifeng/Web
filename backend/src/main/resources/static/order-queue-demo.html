<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>异步下单演示 (Kafka + SSE)</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 16px; }
  label { display: inline-block; margin: 4px 12px 4px 0; }
  input { padding: 4px 6px; width: 140px; }
  button { padding: 6px 14px; margin: 4px 6px 4px 0; cursor: pointer; }
  #log { background: #111; color: #ddd; padding: 12px; border-radius: 8px; font: 13px/1.6 Menlo, Consolas, monospace; min-height: 240px; white-space: pre-wrap; }
  .t { color: #888; } .req { color: #6cf; } .resp { color: #fc6; } .sse { color: #9f9; } .err { color: #f77; } .info { color: #ccc; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-weight: bold; }
  .QUEUED { background: #555; } .PROCESSING { background: #a60; } .SUCCESS { background: #1a7f37; } .FAILED { background: #b42318; }
</style>
</head>
<body>
<h1>促销排队下单演示：POST → 202 → Kafka → @KafkaListener → SSE 推送</h1>

<fieldset>
  <legend>1. 登录</legend>
  <label>用户名 <input id="username"></label>
  <label>密码 <input id="password" type="password"></label>
  <button onclick="login()">登录</button>
</fieldset>

<fieldset>
  <legend>2. 加入购物车</legend>
  <label>书籍 ID <input id="bookId" value="1"></label>
  <label>数量 <input id="qty" value="1"></label>
  <button onclick="addCart()">加入购物车</button>
</fieldset>

<fieldset>
  <legend>3. 提交订单并订阅结果</legend>
  <button onclick="submitOrder()">提交订单 (POST /api/orders)</button>
  <button onclick="tick()">证明页面未阻塞：点我</button>
  <button onclick="document.getElementById('log').innerHTML=''">清空日志</button>
</fieldset>

<div id="log"></div>

<script>
  let token = localStorage.getItem('token') || '';
  const logEl = document.getElementById('log');

  function now() { const d = new Date(); return d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0'); }
  function log(cls, text) {
    const line = document.createElement('div');
    line.innerHTML = `<span class="t">[${now()}]</span> <span class="${cls}"></span>`;
    line.lastChild.textContent = text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function logStatus(msg) {
    const line = document.createElement('div');
    line.innerHTML = `<span class="t">[${now()}]</span> <span class="sse">SSE event: order-status </span><span class="tag ${msg.status}">${msg.status}</span> <span class="sse"></span>`;
    line.lastChild.textContent = JSON.stringify(msg);
    logEl.appendChild(line);
  }

  async function api(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers.Authorization = 'Bearer ' + token;
    const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    return { status: res.status, data };
  }

  async function login() {
    log('req', 'POST /api/v1/users/login');
    const { status, data } = await api('POST', '/api/v1/users/login', {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
    });
    if (status === 200 && data.data) {
      token = data.data.token;
      localStorage.setItem('token', token);
      log('resp', `${status} 登录成功：${data.data.username}`);
    } else {
      log('err', `${status} ${data.message || '登录失败'}`);
    }
  }

  async function addCart() {
    const body = { bookId: Number(document.getElementById('bookId').value), quantity: Number(document.getElementById('qty').value) };
    log('req', 'POST /api/v1/cart ' + JSON.stringify(body));
    const { status, data } = await api('POST', '/api/v1/cart', body);
    log(status === 200 ? 'resp' : 'err', `${status} ${data.message || ''}`);
  }

  async function submitOrder() {
    const body = { receiver: '张三', phone: '13800138000', province: '上海', city: '上海', address: '东川路800号', payment: 'wechat' };
    log('req', 'POST /api/orders ' + JSON.stringify(body));
    const t0 = performance.now();
    const { status, data } = await api('POST', '/api/orders', body);
    const cost = (performance.now() - t0).toFixed(0);
    if (status !== 202) {
      log('err', `${status} ${data.message || ''}（耗时 ${cost} ms）`);
      return;
    }
    log('resp', `${status} Accepted（耗时 ${cost} ms）` + JSON.stringify(data.data));
    subscribe(data.data.queueId);
  }

  function subscribe(queueId) {
    const url = `/api/orders/${queueId}/stream?token=${encodeURIComponent(token)}`;
    log('info', 'EventSource 连接 GET /api/orders/' + queueId + '/stream');
    const es = new EventSource(url);
    es.addEventListener('order-status', (e) => {
      const msg = JSON.parse(e.data);
      logStatus(msg);
      if (msg.status === 'SUCCESS' || msg.status === 'FAILED') {
        es.close();
        log('info', 'SSE 连接已关闭（收到最终结果）');
      }
    });
    es.onerror = () => { es.close(); log('err', 'SSE 连接断开'); };
  }

  let ticks = 0;
  function tick() { log('info', `页面仍可交互 #${++ticks}`); }

  if (token) log('info', '已从 localStorage 读取 token，可直接下单');
</script>
</body>
</html>
