spring.application.name=ebookstore-cloud-backend
server.port=${SERVER_PORT:8081}
server.address=127.0.0.1
spring.threads.virtual.enabled=${VIRTUAL_THREADS_ENABLED:true}
spring.main.keep-alive=true
# Only relevant to the explicit platform-thread benchmark control group.
server.tomcat.threads.max=${PLATFORM_THREAD_LIMIT:20}
server.tomcat.threads.min-spare=5
bookstore.io-delay-ms=${BOOK_IO_DELAY_MS:200}
bookstore.demo.username=${DEMO_USERNAME:student}
bookstore.demo.password=${DEMO_PASSWORD:demo-password}
# No signing key is committed. The startup script supplies an ephemeral one
# unless the user explicitly configures a shared persistent JWT_SECRET.
jwt.secret=${JWT_SECRET}
jwt.issuer=ebookstore-cloud
jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
server.error.include-message=never
server.error.include-stacktrace=never
