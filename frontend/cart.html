<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物车 - 猪猪书城</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="logo">
          <span class="logo-icon">📚</span>
          <span>猪猪书城</span>
        </a>

        <nav>
          <ul class="nav-list">
            <li><a href="index.html" class="nav-link">首页</a></li>
            <li><a href="#" class="nav-link">分类</a></li>
            <li><a href="#" class="nav-link">排行</a></li>
            <li><a href="#" class="nav-link">书单</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <a href="cart.html" class="btn btn-secondary btn-sm btn-cart-active">🛒 购物车</a>
          <a href="login.html" class="btn btn-primary btn-sm">登录</a>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="container">
        <div class="section-header cart-header-section">
          <h1 class="section-title">我的购物车</h1>
          <span class="badge badge-success">3 件商品</span>
        </div>

        <div class="cart-page">
          <div class="cart-header">
            <h2 class="cart-title">购物车列表</h2>
          </div>

          <table class="cart-table">
            <thead>
              <tr>
                <th class="cart-col-product">商品</th>
                <th class="cart-col-price">单价</th>
                <th class="cart-col-qty">数量</th>
                <th class="cart-col-subtotal">小计</th>
                <th class="cart-col-action">操作</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>
                  <div class="cart-product">
                    <img class="cart-product-cover" src="images/100-years-of-solitude.jpg" alt="百年孤独封面">
                    <div class="cart-product-info">
                      <h4>百年孤独</h4>
                      <p>加西亚·马尔克斯</p>
                    </div>
                  </div>
                </td>
                <td class="cart-price">¥49.00</td>
                <td>
                  <div class="quantity-control">
                    <button class="quantity-btn" aria-label="减少数量">−</button>
                    <input type="number" class="quantity-input" value="1" min="1" max="99" aria-label="购买数量">
                    <button class="quantity-btn" aria-label="增加数量">+</button>
                  </div>
                </td>
                <td class="cart-subtotal">¥49.00</td>
                <td>
                  <button class="cart-remove-btn" aria-label="删除商品">🗑️</button>
                </td>
              </tr>

              <tr>
                <td>
                  <div class="cart-product">
                    <img class="cart-product-cover" src="images/sapiens.jpg" alt="人类简史封面">
                    <div class="cart-product-info">
                      <h4>人类简史：从动物到上帝</h4>
                      <p>尤瓦尔·赫拉利</p>
                    </div>
                  </div>
                </td>
                <td class="cart-price">¥68.00</td>
                <td>
                  <div class="quantity-control">
                    <button class="quantity-btn" aria-label="减少数量">−</button>
                    <input type="number" class="quantity-input" value="2" min="1" max="99" aria-label="购买数量">
                    <button class="quantity-btn" aria-label="增加数量">+</button>
                  </div>
                </td>
                <td class="cart-subtotal">¥136.00</td>
                <td>
                  <button class="cart-remove-btn" aria-label="删除商品">🗑️</button>
                </td>
              </tr>

              <tr>
                <td>
                  <div class="cart-product">
                    <img class="cart-product-cover" src="images/to-live.jpg" alt="活着封面">
                    <div class="cart-product-info">
                      <h4>活着</h4>
                      <p>余华</p>
                    </div>
                  </div>
                </td>
                <td class="cart-price">¥35.00</td>
                <td>
                  <div class="quantity-control">
                    <button class="quantity-btn" aria-label="减少数量">−</button>
                    <input type="number" class="quantity-input" value="1" min="1" max="99" aria-label="购买数量">
                    <button class="quantity-btn" aria-label="增加数量">+</button>
                  </div>
                </td>
                <td class="cart-subtotal">¥35.00</td>
                <td>
                  <button class="cart-remove-btn" aria-label="删除商品">🗑️</button>
                </td>
              </tr>
            </tbody>
          </table>

          <div class="cart-summary">
            <div class="cart-summary-info">
              <h4>商品总价：<span class="cart-summary-total">¥220.00</span></h4>
              <p class="cart-shipping-note">运费：免运费</p>
            </div>
            <div class="cart-summary-actions">
              <a href="index.html" class="btn btn-secondary">继续购物</a>
              <a href="order.html" class="btn btn-primary btn-lg">去结算</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 猪猪书城. 探索知识的无限可能</p>
    </footer>
  </div>
</body>
</html>
