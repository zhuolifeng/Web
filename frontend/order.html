<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>确认订单 - 猪猪书城</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page-wrapper">
    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="logo">
          <span class="logo-icon">📚</span>
          <span>猪猪书城</span>
        </a>

        <nav>
          <ul class="nav-list">
            <li><a href="index.html" class="nav-link">首页</a></li>
            <li><a href="#" class="nav-link">分类</a></li>
            <li><a href="#" class="nav-link">排行</a></li>
            <li><a href="#" class="nav-link">书单</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <a href="cart.html" class="btn btn-secondary btn-sm">🛒 购物车</a>
          <a href="login.html" class="btn btn-primary btn-sm">登录</a>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="container">
        <nav class="breadcrumb" aria-label="面包屑导航">
          <ol class="breadcrumb-list">
            <li class="breadcrumb-item">
              <a href="index.html" class="breadcrumb-link">首页</a>
              <span class="breadcrumb-sep">/</span>
            </li>
            <li class="breadcrumb-item">
              <a href="cart.html" class="breadcrumb-link">购物车</a>
              <span class="breadcrumb-sep">/</span>
            </li>
            <li class="breadcrumb-item">
              <span class="breadcrumb-current">确认订单</span>
            </li>
          </ol>
        </nav>

        <h1 class="section-title order-page-title">确认订单</h1>

        <div class="order-page">
          <div class="order-main">
            <section class="order-section">
              <header class="order-section-header">
                <h2 class="order-section-title">📦 收货信息</h2>
              </header>
              <div class="order-section-body">
                <form>
                  <div class="form-grid">
                    <div class="form-group">
                      <label for="name" class="form-label">收货人姓名</label>
                      <input type="text" id="name" class="form-input" placeholder="请输入收货人姓名" required>
                    </div>
                    <div class="form-group">
                      <label for="phone" class="form-label">联系电话</label>
                      <input type="tel" id="phone" class="form-input" placeholder="请输入联系电话" required>
                    </div>
                    <div class="form-group full-width">
                      <label for="province" class="form-label">省份/直辖市</label>
                      <select id="province" class="form-input" required>
                        <option value="">请选择省份</option>
                        <option value="beijing">北京市</option>
                        <option value="shanghai">上海市</option>
                        <option value="guangdong">广东省</option>
                        <option value="zhejiang">浙江省</option>
                        <option value="jiangsu">江苏省</option>
                      </select>
                    </div>
                    <div class="form-group full-width">
                      <label for="city" class="form-label">城市</label>
                      <select id="city" class="form-input" required>
                        <option value="">请选择城市</option>
                        <option value="beijing">北京市</option>
                        <option value="shanghai">上海市</option>
                        <option value="guangzhou">广州市</option>
                        <option value="shenzhen">深圳市</option>
                        <option value="hangzhou">杭州市</option>
                      </select>
                    </div>
                    <div class="form-group full-width">
                      <label for="district" class="form-label">区县</label>
                      <select id="district" class="form-input" required>
                        <option value="">请选择区县</option>
                        <option value="haidian">海淀区</option>
                        <option value="chaoyang">朝阳区</option>
                        <option value="xihu">西湖区</option>
                        <option value="nanshan">南山区</option>
                      </select>
                    </div>
                    <div class="form-group full-width">
                      <label for="address" class="form-label">详细地址</label>
                      <input type="text" id="address" class="form-input" placeholder="请输入详细地址（街道、门牌号等）" required>
                    </div>
                    <div class="form-group full-width">
                      <label for="remark" class="form-label">订单备注（可选）</label>
                      <input type="text" id="remark" class="form-input" placeholder="请输入订单备注">
                    </div>
                  </div>
                </form>
              </div>
            </section>

            <section class="order-section section-mt">
              <header class="order-section-header">
                <h2 class="order-section-title">📚 商品清单</h2>
              </header>
              <div class="order-section-body">
                <div class="order-items">
                  <div class="order-item">
                    <img class="order-item-cover" src="images/100-years-of-solitude.jpg" alt="百年孤独封面">
                    <div class="order-item-info">
                      <h4>百年孤独</h4>
                      <p>加西亚·马尔克斯</p>
                    </div>
                    <div class="order-item-price-group">
                      <span class="order-item-price">¥49.00</span>
                      <span class="order-item-qty">× 1</span>
                    </div>
                    <span class="order-item-subtotal">¥49.00</span>
                  </div>

                  <div class="order-item">
                    <img class="order-item-cover" src="images/sapiens.jpg" alt="人类简史封面">
                    <div class="order-item-info">
                      <h4>人类简史：从动物到上帝</h4>
                      <p>尤瓦尔·赫拉利</p>
                    </div>
                    <div class="order-item-price-group">
                      <span class="order-item-price">¥68.00</span>
                      <span class="order-item-qty">× 2</span>
                    </div>
                    <span class="order-item-subtotal">¥136.00</span>
                  </div>

                  <div class="order-item">
                    <img class="order-item-cover" src="images/to-live.jpg" alt="活着封面">
                    <div class="order-item-info">
                      <h4>活着</h4>
                      <p>余华</p>
                    </div>
                    <div class="order-item-price-group">
                      <span class="order-item-price">¥35.00</span>
                      <span class="order-item-qty">× 1</span>
                    </div>
                    <span class="order-item-subtotal">¥35.00</span>
                  </div>
                </div>
              </div>
            </section>

            <section class="order-section section-mt">
              <header class="order-section-header">
                <h2 class="order-section-title">💳 配送方式</h2>
              </header>
              <div class="order-section-body">
                <div class="shipping-row">
                  <label class="payment-method selected shipping-option">
                    <input type="radio" name="shipping" value="standard" checked>
                    <div class="payment-icon">🚚</div>
                    <div class="payment-info">
                      <h4>标准配送</h4>
                      <p>3-5个工作日送达</p>
                    </div>
                    <span class="shipping-free">免费</span>
                  </label>
                  <label class="payment-method shipping-option">
                    <input type="radio" name="shipping" value="express">
                    <div class="payment-icon">✈️</div>
                    <div class="payment-info">
                      <h4>快速配送</h4>
                      <p>1-2个工作日送达</p>
                    </div>
                    <span class="shipping-cost">¥15.00</span>
                  </label>
                </div>
              </div>
            </section>
          </div>

          <aside class="order-sidebar">
            <div class="order-summary-card">
              <header class="order-summary-header">
                <h3>订单摘要</h3>
              </header>
              <div class="order-summary-body">
                <div class="summary-row">
                  <span class="summary-label">商品总价</span>
                  <span class="summary-value">¥220.00</span>
                </div>
                <div class="summary-row">
                  <span class="summary-label">运费</span>
                  <span class="summary-value summary-shipping-free">免运费</span>
                </div>
                <div class="summary-row">
                  <span class="summary-label">优惠码</span>
                  <span class="summary-value">- ¥0.00</span>
                </div>
                <div class="summary-row total">
                  <span class="summary-label">合计</span>
                  <span class="summary-value">¥220.00</span>
                </div>

                <div class="payment-methods">
                  <h4 class="order-summary-title">💰 支付方式</h4>

                  <label class="payment-method selected">
                    <input type="radio" name="payment" value="alipay" checked>
                    <div class="payment-icon">💙</div>
                    <div class="payment-info">
                      <h4>支付宝</h4>
                      <p>推荐使用</p>
                    </div>
                  </label>

                  <label class="payment-method">
                    <input type="radio" name="payment" value="wechat">
                    <div class="payment-icon">🟢</div>
                    <div class="payment-info">
                      <h4>微信支付</h4>
                      <p>快捷安全</p>
                    </div>
                  </label>

                  <label class="payment-method">
                    <input type="radio" name="payment" value="card">
                    <div class="payment-icon">💳</div>
                    <div class="payment-info">
                      <h4>银行卡</h4>
                      <p>支持主流银行卡</p>
                    </div>
                  </label>
                </div>

                <a href="#" class="btn btn-primary btn-block btn-lg place-order-btn">提交订单</a>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 猪猪书城. 探索知识的无限可能</p>
    </footer>
  </div>
</body>
</html>
